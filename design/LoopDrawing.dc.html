<sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
<sc-if value="{{ phoneLit }}">
<ol style="margin:6px 0 0;padding:0;list-style:none;width:335px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:14px;line-height:18px;font-weight:600;color:#696259;text-align:center"><li style="color:#221D18;font-weight:700">This phone</li><li>QR</li><li>RHU laptop</li><li>QR</li><li>This phone</li></ol>
</sc-if>
<sc-if value="{{ notPhoneLit }}" hint-placeholder-val="{{ true }}">
<ol style="margin:6px 0 0;padding:0;list-style:none;width:335px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:14px;line-height:18px;font-weight:600;color:#4D463F;text-align:center"><li>This phone</li><li>QR</li><li>RHU laptop</li><li>QR</li><li>This phone</li></ol>

</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:335,&quot;height&quot;:96},&quot;lit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;phone&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;'all'|'phone'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;drawn&quot;,&quot;start&quot;],&quot;default&quot;:&quot;drawn&quot;,&quot;tsType&quot;:&quot;'drawn'|'start'&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lit = this.props.lit || 'all';
    const state = this.props.state || 'drawn';
    const phoneLit = lit === 'phone';
    return {
      phoneLit, notPhoneLit: !phoneLit,
      allDrawn: !phoneLit && state !== 'start',
      allStart: !phoneLit && state === 'start',
      showLabels: this.props.labels !== false && this.props.labels !== 'false',
    };
  }
}
</script>
</body>
</html>
