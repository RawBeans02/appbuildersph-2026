<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<sc-if value="{{ light }}" hint-placeholder-val="{{ true }}">
<div style="height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 28px;color:#221D18;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif">
<span style="font-size:15px;font-weight:700;letter-spacing:0.01em">8:12</span>
<span style="display:flex;align-items:center;gap:8px;font-size:16px">
<sc-if value="{{ offline }}" hint-placeholder-val="{{ true }}"><i class="ph-fill ph-airplane" aria-label="Airplane mode"></i></sc-if>
<sc-if value="{{ online }}"><i class="ph-fill ph-cell-signal-full" aria-label="Signal"></i></sc-if>
<i class="ph-fill ph-battery-high" style="font-size:22px"></i>
</span>
</div>
</sc-if>
<sc-if value="{{ dark }}">
<div style="height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 28px;color:#F7F4ED;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif">
<span style="font-size:15px;font-weight:700;letter-spacing:0.01em">8:12</span>
<span style="display:flex;align-items:center;gap:8px;font-size:16px">
<sc-if value="{{ offline }}" hint-placeholder-val="{{ true }}"><i class="ph-fill ph-airplane" aria-label="Airplane mode"></i></sc-if>
<sc-if value="{{ online }}"><i class="ph-fill ph-cell-signal-full" aria-label="Signal"></i></sc-if>
<i class="ph-fill ph-battery-high" style="font-size:22px"></i>
</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:40},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;online&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = (v) => v === true || v === 'true';
    const dark = t(this.props.dark);
    const online = t(this.props.online);
    return { dark, light: !dark, online, offline: !online };
  }
}
</script>
</body>
</html>
