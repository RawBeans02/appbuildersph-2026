<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
</helmet>
<sc-if value="{{ light }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:14px;line-height:20px;font-weight:600">
<span style="display:inline-flex;align-items:center;gap:5px;color:#0D6880;white-space:nowrap"><i class="{{ deviceIcon }}" style="font-size:16px"></i>{{ deviceLabel }}</span>
<sc-if value="{{ offline }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:5px;color:#4D463F;white-space:nowrap"><i class="ph-bold ph-cloud-slash" style="font-size:16px"></i>Offline</span></sc-if>
</div>
</sc-if>
<sc-if value="{{ dark }}">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:14px;line-height:20px;font-weight:600">
<span style="display:inline-flex;align-items:center;gap:5px;color:#91CFE5;white-space:nowrap"><i class="{{ deviceIcon }}" style="font-size:16px"></i>{{ deviceLabel }}</span>
<sc-if value="{{ offline }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:5px;color:#C7C3BD;white-space:nowrap"><i class="ph-bold ph-cloud-slash" style="font-size:16px"></i>Offline</span></sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:24},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;laptop&quot;],&quot;default&quot;:&quot;phone&quot;,&quot;tsType&quot;:&quot;'phone'|'laptop'&quot;},&quot;online&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = (v) => v === true || v === 'true';
    const dark = t(this.props.dark);
    const online = t(this.props.online);
    const laptop = this.props.device === 'laptop';
    return {
      dark, light: !dark, offline: !online,
      deviceIcon: laptop ? 'ph-bold ph-laptop' : 'ph-bold ph-device-mobile',
      deviceLabel: laptop ? 'Runs on this laptop' : 'Runs on this phone',
    };
  }
}
</script>
</body>
</html>
