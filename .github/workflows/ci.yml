# Cloud checks for every push to main (and any PR), so the 8 GB laptop
# doesn't have to run the full suite. Steps call the npm scripts in package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every push to main gets its own complete run (several agents push minutes
# apart, and a cancelled run proves nothing); a PR's older runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The optional phase 2 API (api/, server/) against a real Postgres in a
  # throwaway service container. Every value below is a dummy for this job
  # only: no secret, no real database. The offline e2e never needs it.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agapay_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/agapay_test
      MUNICIPAL_ENROLL_CODE: ci-dummy-enroll-code
      DOH_VIEW_CODE: ci-dummy-view-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api

  # The offline end-to-end test: built app, real service worker, network cut
  # off in the browser. Runs here, never on the laptop.
  # Twice: the offline core as shipped, and with phase 2 on (VITE_PHASE2: the
  # PIN lock and encrypted records), where every spec unlocks first.
  e2e:
    name: e2e ${{ matrix.browser }}${{ matrix.phase2 && ' (phase 2)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # WebKit (an iPhone 14 Pro Max profile) runs the specs that matter on
        # iPhone Safari; see the webkit project in playwright.config.ts.
        browser: [chromium, webkit]
        phase2: ['', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: true
          VITE_PHASE2: ${{ matrix.phase2 }}
      # The README's screenshots (docs/demo/*.png): the e2e specs take them
      # offline with synthetic data; this keeps the default build's set.
      - if: success() && matrix.browser == 'chromium' && matrix.phase2 == ''
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: docs/demo/*.png
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}${{ matrix.phase2 && '-phase2' || '' }}
          path: test-results/
          retention-days: 3
