# Cloud checks for every push to main (and any PR), so the 8 GB laptop
# doesn't have to run the full suite. Steps call the npm scripts in package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every push to main gets its own complete run (several agents push minutes
# apart, and a cancelled run proves nothing); a PR's older runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The offline end-to-end test: built app, real service worker, network cut
  # off in the browser. Runs here, never on the laptop.
  # Twice: the offline core as shipped, and with phase 2 on (VITE_PHASE2: the
  # PIN lock and encrypted records), where every spec unlocks first.
  e2e:
    name: e2e${{ matrix.phase2 && ' (phase 2)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase2: ['', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          VITE_PHASE2: ${{ matrix.phase2 }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces${{ matrix.phase2 && '-phase2' || '' }}
          path: test-results/
          retention-days: 3
